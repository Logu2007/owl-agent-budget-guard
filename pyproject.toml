[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-agent-budget-guard"
version = "0.1.0"
description = "Local budget, token, request, tool and time limits for AI agent runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "budget", "llm", "cost-control", "rate-limit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Framework integrations are optional. The core package never imports them.
openai = ["openai>=1"]
langgraph = ["langgraph>=1.0,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    # The integration tests need these; they are installed so CI runs them.
    "openai>=1",
    "langgraph>=1.0,<2",
]

[project.scripts]
owl-budget = "owl_agent_budget_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owl_agent_budget_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as argument defaults by design.
"src/owl_agent_budget_guard/cli.py" = ["B008"]

[tool.coverage.run]
source = ["owl_agent_budget_guard"]
branch = true

[tool.coverage.report]
show_missing = true
